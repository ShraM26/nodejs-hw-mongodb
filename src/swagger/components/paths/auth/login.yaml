tags:
  - name: auth
    description: User authentication
summary: User login
operationId: loginUser
description: |
  This endpoint allows the user to log in using their email and password.
  Upon successful login, an access token and refresh token will be returned.
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          email:
            type: string
            format: email
            example: user@example.com
          password:
            type: string
            example: mypassword123
responses:
  200:
    description: Successful login
    content:
      application/json:
        schema:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
  400:
    description: Bad Request - Invalid input
  401:
    description: Unauthorized - Incorrect credentials
