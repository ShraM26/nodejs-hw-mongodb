get:
  tags:
    - Contacts
  summary: Get all contacts
  operationId: getAllContacts
  description: Retrieve all contacts with optional filtering, sorting, and pagination.
  security:
    - bearerAuth: []
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
      description: Page number for pagination
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 10
      description: Number of contacts per page
    - name: sortBy
      in: query
      required: false
      schema:
        type: string
      description: Field to sort the contacts by
    - name: filter
      in: query
      required: false
      schema:
        type: string
      description: Filter contacts by a specific field (e.g., name, email)
  responses:
    '200':
      description: Successful response with a list of contacts
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../components/schemas/Contact.yaml'
    '401':
      description: Unauthorized - missing or invalid token
