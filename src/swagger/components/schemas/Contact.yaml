Contact:
  type: object
  properties:
    id:
      type: string
      description: Unique identifier for the contact
    name:
      type: string
      description: Name of the contact
    email:
      type: string
      format: email
      description: Contact's email address
    phone:
      type: string
      description: Contact's phone number
  required:
    - id
    - name
    - email
